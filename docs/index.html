    <script>
      (function () {
        async function copyCommand(command) {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(command);
            return;
          }
          const ta = document.createElement('textarea');
          ta.value = command;
          ta.style.position = 'fixed';
          ta.style.top = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }

        const copyBtn = document.getElementById('copyCliBtn');
        const copyLabel = document.getElementById('copyCliText');
        const copyIcon = copyBtn ? copyBtn.querySelector('.copy-icon') : null;
        if (copyBtn && copyLabel) {
          const idle = copyLabel.innerHTML;
          copyBtn.addEventListener('click', async function () {
            try {
              await copyCommand('npx pgpjs init');
              copyBtn.classList.add('copied');
              copyLabel.innerHTML = '&#10003;&nbsp;Copied!';
              if (copyIcon) {
                copyIcon.style.display = 'none';
              }
              setTimeout(function () {
                copyBtn.classList.remove('copied');
                copyLabel.innerHTML = idle;
                if (copyIcon) {
                  copyIcon.style.display = 'inline-block';
                }
              }, 2000);
            } catch (err) {
              console.error('Failed to copy to clipboard:', err);
            }
          });
        }

        document.addEventListener('click', async function (event) {
          const installBtn = event.target.closest('[data-copy]');
          if (!installBtn) {
            return;
          }
          const command = installBtn.getAttribute('data-copy');
          if (!command) {
            return;
          }
          const idle = installBtn.textContent;
          try {
            await copyCommand(command);
            installBtn.classList.add('copied');
            installBtn.textContent = 'Copied';
            setTimeout(function () {
              installBtn.classList.remove('copied');
              installBtn.textContent = idle;
            }, 2000);
          } catch (err) {
            console.error('Failed to copy to clipboard:', err);
          }
        });

        function initCardSwipe() {
          const mobile = window.matchMedia('(max-width: 900px)');
          document.querySelectorAll('[data-swipe]').forEach(function (row) {
            const cards = Array.prototype.slice.call(
              row.querySelectorAll(':scope > .under-card, :scope > .logo-slot'),
            );
            if (cards.length < 2) {
              return;
            }

            const controls = document.createElement('div');
            controls.className = 'under-swipe-controls';

            const prev = document.createElement('button');
            prev.type = 'button';
            prev.className = 'under-swipe-arrow';
            prev.setAttribute('aria-label', 'Previous card');
            prev.textContent = '‹';

            const next = document.createElement('button');
            next.type = 'button';
            next.className = 'under-swipe-arrow';
            next.setAttribute('aria-label', 'Next card');
            next.textContent = '›';

            const dots = document.createElement('div');
            dots.className = 'under-swipe-dots';
            dots.setAttribute('role', 'tablist');
            dots.setAttribute('aria-label', 'Card slides');
            cards.forEach(function (card, index) {
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.setAttribute('aria-label', 'Show card ' + (index + 1));
              btn.addEventListener('click', function () {
                goTo(index);
              });
              dots.appendChild(btn);
            });

            controls.appendChild(prev);
            controls.appendChild(dots);
            controls.appendChild(next);

            function syncMode() {
              if (mobile.matches) {
                if (!controls.isConnected) {
                  row.after(controls);
                }
              } else if (controls.isConnected) {
                controls.remove();
              }
            }

            function activeIndex() {
              const rowRect = row.getBoundingClientRect();
              const mid = rowRect.left + row.clientWidth / 2;
              let best = 0;
              let bestDist = Infinity;
              cards.forEach(function (card, index) {
                const rect = card.getBoundingClientRect();
                const dist = Math.abs(rect.left + rect.width / 2 - mid);
                if (dist < bestDist) {
                  bestDist = dist;
                  best = index;
                }
              });
              return best;
            }

            function goTo(index) {
              const nextIndex = Math.max(0, Math.min(cards.length - 1, index));
              const card = cards[nextIndex];
              const rowRect = row.getBoundingClientRect();
              const cardRect = card.getBoundingClientRect();
              const left =
                row.scrollLeft +
                (cardRect.left - rowRect.left) -
                (row.clientWidth - card.offsetWidth) / 2;
              row.scrollTo({ left: Math.max(0, left), behavior: 'smooth' });
            }

            function syncControls() {
              const current = activeIndex();
              Array.prototype.forEach.call(
                dots.children,
                function (btn, index) {
                  btn.setAttribute(
                    'aria-current',
                    index === current ? 'true' : 'false',
                  );
                },
              );
              prev.disabled = current <= 0;
              next.disabled = current >= cards.length - 1;
            }

            prev.addEventListener('click', function () {
              goTo(activeIndex() - 1);
            });
            next.addEventListener('click', function () {
              goTo(activeIndex() + 1);
            });
            row.addEventListener('scroll', syncControls, { passive: true });
            window.addEventListener('resize', function () {
              syncMode();
              syncControls();
            });
            syncMode();
            row.addEventListener('keydown', function (event) {
              if (!mobile.matches) {
                return;
              }
              if (event.key === 'ArrowLeft') {
                event.preventDefault();
                goTo(activeIndex() - 1);
              } else if (event.key === 'ArrowRight') {
                event.preventDefault();
                goTo(activeIndex() + 1);
              }
            });
            syncControls();

            let pointerId = null;
            let startX = 0;
            let startLeft = 0;
            row.addEventListener('pointerdown', function (event) {
              if (!mobile.matches || event.pointerType === 'touch') {
                return;
              }
              if (event.target.closest('a, button')) {
                return;
              }
              pointerId = event.pointerId;
              startX = event.clientX;
              startLeft = row.scrollLeft;
              row.classList.add('is-dragging');
              row.setPointerCapture(pointerId);
            });
            row.addEventListener('pointermove', function (event) {
              if (pointerId === null) {
                return;
              }
              row.scrollLeft = startLeft - (event.clientX - startX);
            });
            function endDrag() {
              if (pointerId === null) {
                return;
              }
              pointerId = null;
              row.classList.remove('is-dragging');
              goTo(activeIndex());
            }
            row.addEventListener('pointerup', endDrag);
            row.addEventListener('pointercancel', endDrag);
          });
        }

        initCardSwipe();
      })();
    </script>
  </body>
